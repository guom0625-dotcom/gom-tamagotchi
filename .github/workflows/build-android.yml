name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 1.2.3) — 미입력 시 run_number 사용'
        required: false

# 릴리즈 빌드는 한 번에 하나씩, 태그를 올린 순서대로.
# 대기 중인 빌드가 있는데 더 새 태그가 오면 대기 중이던 것은 취소되고 새 것만 빌드된다.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Gradle 의존성 캐시 — 키를 package-lock.json 기반으로 고정
      # (android/는 매번 재생성되므로 build.gradle 기반 캐시는 항상 미스)
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-

      # ── 1. 버전 결정 ──────────────────────────────
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 태그 push: v1.2.3 → 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION"          >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "version=$VERSION"          >> $GITHUB_OUTPUT

      # ── 2. 의존성 설치 ──────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 3. Expo → android/ 생성 ─────────────────
      - name: Expo prebuild (Android)
        env:
          EXPO_VERSION: ${{ env.VERSION }}
          EXPO_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: npx expo prebuild --platform android --no-install

      # ── 4. 키스토어 복원 ────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/keystore.jks
          echo "keystore size: $(wc -c < android/app/keystore.jks) bytes"

      # ── 5. 서명 설정 주입 ───────────────────────
      - name: Inject signing config into build.gradle
        shell: python3 {0}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          import re, os
          path = "android/app/build.gradle"
          content = open(path).read()

          signing = f"""    signingConfigs {{
              release {{
                  storeFile file("keystore.jks")
                  storePassword "{os.environ['KEYSTORE_PASSWORD']}"
                  keyAlias "{os.environ['KEY_ALIAS']}"
                  keyPassword "{os.environ['KEY_PASSWORD']}"
              }}
          }}
          """
          if "signingConfigs" not in content:
              content = content.replace("    buildTypes {", signing + "    buildTypes {", 1)

          if "signingConfig signingConfigs.release" not in content:
              content = re.sub(
                  r"(buildTypes\s*\{[^}]*?release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  content, count=1, flags=re.DOTALL
              )

          open(path, "w").write(content)
          print("build.gradle patched ✓")

      # ── 6. APK 빌드 ─────────────────────────────
      - name: Build release APK
        working-directory: android
        env:
          EXPO_VERSION: ${{ env.VERSION }}
          EXPO_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: gradle :app:assembleRelease

      # ── 7. APK 이름 변경 ────────────────────────
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/gom-tamagotchi-v${{ steps.ver.outputs.version }}.apk

      # ── 8. Artifact 업로드 (항상) ────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-v${{ steps.ver.outputs.version }}
          path: android/app/build/outputs/apk/release/*.apk

      # ── 9. GitHub Release 생성 (태그 push 시) ───
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
